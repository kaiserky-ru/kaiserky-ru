<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thread</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="index.html">Kaiserky.ru</a></h1>
    <p id="thread-heading" class="tagline">načítám hovna...</p>
  </header>

  <main class="container">
    <div class="toolbar">
      <a id="back-board" href="index.html">← zpátky na board</a>
      <button id="refresh" type="button">Znovuzrození</button>
    </div>

    <section id="posts" aria-live="polite">
      <p>načítám hovno...</p>
    </section>

    <section class="panel new-reply">
      <h2>Reply</h2>
      <form id="reply-form">
        <label>
          Comment
          <textarea id="comment" maxlength="5000" required placeholder="Comment"></textarea>
        </label>

        <label>
          Image
          <input id="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
        </label>

        <p class="hint">Images: JPEG, PNG, GIF or WebP, maximum 5 MB.</p>

        <button type="submit">Post reply</button>
        <p id="form-status" class="status" role="status"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/thread.js"></script>
</body>
</html>
